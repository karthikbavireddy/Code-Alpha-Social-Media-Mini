services:
  - type: web
    name: connectsphere
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn connectsphere.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: connectsphere-db
          property: connectionString

databases:
  - name: connectsphere-db
    plan: free
