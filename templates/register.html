{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account — ConnectSphere{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo" style="justify-content: center;">
                <div class="brand-icon">CS</div>
                <span>ConnectSphere</span>
            </div>
            <h1 class="auth-title">Join ConnectSphere</h1>
            <p class="auth-subtitle">Create your personal profile and connect globally</p>
        </div>

        <!-- Dynamic Error Banner -->
        <div id="auth-error" class="card" style="display: none; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #f87171; font-size: 0.9rem; padding: 0.75rem 1rem; margin-bottom: 1.25rem;"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="reg-username" class="form-label">Username</label>
                <input type="text" id="reg-username" class="form-input" placeholder="Choose a unique username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="reg-email" class="form-label">Email Address</label>
                <input type="email" id="reg-email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="reg-password" class="form-label">Password</label>
                <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="reg-confirm-password" class="form-label">Confirm Password</label>
                <input type="password" id="reg-confirm-password" class="form-input" placeholder="Repeat your password" required autocomplete="new-password">
            </div>

            <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login_page' %}" id="link-to-login">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
