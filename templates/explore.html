{% extends 'base.html' %}
{% load static %}

{% block title %}Explore People — ConnectSphere{% endblock %}

{% block content %}
<div class="app-container single-column">
    <div class="search-header">
        <h1 style="font-family: var(--font-heading); font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem;">
            Explore ConnectSphere
        </h1>
        <p style="color: var(--text-secondary); margin-bottom: 1.25rem;">
            Discover active community members, colleagues, and creators.
        </p>

        <div class="search-input-wrap">
            <span class="search-icon" style="display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="explore-search-input" class="search-input" placeholder="Search members (@user) or tags (#hashtag)..." autofocus>
        </div>

        <!-- Explore Tabs: Members vs Posts (#Hashtags) -->
        <div class="explore-tabs" style="display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: center;">
            <button type="button" id="tab-explore-members" class="btn btn-primary btn-sm" onclick="switchExploreTab('members')">
                👥 Members
            </button>
            <button type="button" id="tab-explore-posts" class="btn btn-outline btn-sm" onclick="switchExploreTab('posts')">
                🏷️ Posts & Hashtags
            </button>
        </div>
    </div>

    <!-- Dynamic User Grid -->
    <div class="user-grid" id="user-results-grid">
        <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-title">Loading members...</div>
        </div>
    </div>

    <!-- Dynamic Posts Grid -->
    <div class="post-list" id="post-results-grid" style="display: none; margin-top: 1.5rem; max-width: 680px; margin-left: auto; margin-right: auto;">
        <!-- Injected matching posts -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/explore.js' %}?v=2.7"></script>
{% endblock %}
