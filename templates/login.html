{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In — ConnectSphere{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo" style="justify-content: center;">
                <div class="brand-icon">CS</div>
                <span>ConnectSphere</span>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Enter your credentials to access your network</p>
        </div>

        <!-- Dynamic Error Banner -->
        <div id="auth-error" class="card" style="display: none; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #f87171; font-size: 0.9rem; padding: 0.75rem 1rem; margin-bottom: 1.25rem;"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-username" class="form-label">Username or Email</label>
                <input type="text" id="login-username" class="form-input" placeholder="e.g. alex or alex@example.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="login-password" class="form-label">Password</label>
                <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register_page' %}" id="link-to-register">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
